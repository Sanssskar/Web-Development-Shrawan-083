<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AOS- Animate on Scroll</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">
</head>
<body>
    <div data-aos="fade-up">Fadeup</div>
    <div data-aos="fade-down">Fadedown</div>
    <div data-aos="fade-right">Faderight</div>
    <div data-aos="fade-left">Fadeleft</div>
    <div data-aos="flip-left">Flipleft</div>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
  AOS.init(
    {
        duration:1000,
    }
  );
</script>
</body>
</html>
