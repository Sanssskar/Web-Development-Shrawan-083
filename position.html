<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
      integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    :root{
        --primary-color:57,177,190;
    }
    /* body {
      height: 500vh;
    } */
    /* static,relative,absolute,sticky,fixed  */
    /* relative- afno position bata sarxa , 
    absolute- afno parent relative xa vaney tya gayera tasinxa ,
    if xaina vaney chei root html/body sanga gayera tasinxa */
    .box {
      /* position: relative; */
      width: 600px;
      height: 600px;
      background-color: beige;
    }
    .card {
      position: sticky;
      top: 20px;
      left: 50px;
      width: 200px;
      height: 200px;
      background-color: blue;
    }
    .whatsapp{
        position: fixed;
        bottom: 2px;
        right: 2px;
        padding: 5px;
        border: none;
        border-radius: 50px;
        z-index: 10;
        background-color: #25D366;
        color: white;
    }
    h1{
        color: rgba(var(--primary-color));
    }
  </style>
  <body>
      <h1>Position study</h1>
      
      <div class="box">
          <div class="card"></div>
        </div>
        <button class="whatsapp">
            <i class="fa-brands fa-whatsapp"></i>
        </button>
    <!-- CDN- Content Delivery Network  -->
  </body>
</html>
