<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive</title>
  </head>
  <style>
    h1 {
      font-size: 2rem;
      color: red;
    }
    .box {
      height: 200px;
      width: 100%;
      background-color: aqua;
      border: 1px solid black;
    }
    .container {
      display: grid;
      grid-template-columns: 1fr;
      justify-items: center;
      gap: 5px;
    }
    /* tablet view  */
    @media (min-width: 468px) and (max-width: 768px) {
      h1 {
        font-size: 7rem;
        color: blue;
      }
      .container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        justify-items: center;
        gap: 5px;
      }
    }
    @media (min-width: 769px) and (max-width: 1200px) {
      h1 {
        font-size: 10rem;
        color: blueviolet;
      }
      .container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        justify-items: center;
        gap: 5px;
      }
    }
    @media (min-width: 1201px) {
      h1 {
        font-size: 15rem;
        color: aqua;
      }
      .container {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        justify-items: center;
        gap: 5px;
      }
    }
  </style>
  <body>
    <h1>Hello world</h1>
    <div class="container">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
  </body>
</html>
